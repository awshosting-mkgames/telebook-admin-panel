# Production nginx config for Telebook Admin Panel
# File: /etc/nginx/sites-available/admin.telebookservices.com
# Copy this file to the nginx sites-available directory and symlink it into sites-enabled.
# Example:
# sudo cp /var/www/telebook-admin-panel/nginx-admin.conf /etc/nginx/sites-available/admin.telebookservices.com
# sudo ln -s /etc/nginx/sites-available/admin.telebookservices.com /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

server {
    listen 80;
    server_name admin.telebookservices.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.telebookservices.com;

    # This is the built frontend output directory created by:
    # cd /var/www/telebook-admin-panel && npm run build
    root /var/www/telebook-admin-panel/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/admin.telebookservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.telebookservices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # React/Vite SPA route fallback
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to backend.
    # If backend is on same EC2 instance, use:
    # proxy_pass http://127.0.0.1:5000;
    # If backend is external domain, use its HTTPS URL instead.
    location /api/ {
        proxy_pass https://api.telebookservices.com;
        proxy_http_version 1.1;
        proxy_set_header Host api.telebookservices.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Upload limit
    client_max_body_size 20M;
}
